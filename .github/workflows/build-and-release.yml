name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签 / Release tag（例如 / e.g. v1.0.1）'
        required: true
      draft:
        description: '仅草稿发布 / Draft release：true=创建草稿（不公开，便于先检查）；false=正式发布'
        type: choice
        options:
          - 'false'
          - 'true'
        required: false
        default: 'false'
      prerelease:
        description: '预发布 / Prerelease：true=标记为预发布（测试版）；false=标记为正式稳定版'
        type: choice
        options:
          - 'false'
          - 'true'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync app version from tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $rawTag = "${{ inputs.tag }}"
          } else {
            $rawTag = "${{ github.ref_name }}"
          }
          $version = $rawTag -replace '^v', ''
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Invalid release tag: $rawTag"
          }
          npm version $version --no-git-tag-version --allow-same-version

      - name: Type check
        run: npm run typecheck

      - name: Build Windows packages
        if: matrix.os == 'windows-latest'
        run: npm run package:win

      - name: Build macOS packages
        if: matrix.os == 'macos-latest'
        run: npm run package:mac

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft == 'true' || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease == 'true' || false }}
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
