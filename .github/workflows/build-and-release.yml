name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '发布标签 / Release tag（例如 / e.g. v1.0.1）'
        required: true
      draft:
        description: '仅草稿发布 / Draft release：true=创建草稿（不公开，便于先检查）；false=正式发布'
        type: choice
        options:
          - 'false'
          - 'true'
        required: false
        default: 'false'
      prerelease:
        description: '预发布 / Prerelease：true=标记为预发布（测试版）；false=标记为正式稳定版'
        type: choice
        options:
          - 'false'
          - 'true'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync app version from tag
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $rawTag = "${{ inputs.tag }}"
          } else {
            $rawTag = "${{ github.ref_name }}"
          }
          $version = $rawTag -replace '^v', ''
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Invalid release tag: $rawTag"
          }
          npm version $version --no-git-tag-version --allow-same-version

      - name: Type check
        run: npm run typecheck

      - name: Build app
        run: npm run build

      - name: Build Windows packages
        if: matrix.os == 'windows-latest'
        run: npm run package:win

      - name: Build macOS packages
        if: matrix.os == 'macos-latest'
        run: npm run package:mac

      - name: Upload Windows release assets
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows-latest
          path: |
            dist/*.exe
          if-no-files-found: error

      - name: Upload macOS release assets
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: dist-macos-latest
          path: |
            dist/*.dmg
            dist/*-mac.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Normalize release asset names
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          OUT_DIR="release-final"
          mkdir -p "$OUT_DIR"

          shopt -s nullglob
          for f in release-assets/*.exe; do
            base="$(basename "$f")"
            if [[ "$base" == *"Setup"* ]]; then
              cp "$f" "$OUT_DIR/m3u8-helper_${VERSION}_windows_x64_setup.exe"
            else
              cp "$f" "$OUT_DIR/m3u8-helper_${VERSION}_windows_x64_portable.exe"
            fi
          done

          for f in release-assets/*.dmg; do
            base="$(basename "$f")"
            if [[ "$base" == *"-arm64.dmg" ]]; then
              cp "$f" "$OUT_DIR/m3u8-helper_${VERSION}_macos_arm64.dmg"
            else
              cp "$f" "$OUT_DIR/m3u8-helper_${VERSION}_macos_x64.dmg"
            fi
          done

          for f in release-assets/*-mac.zip; do
            base="$(basename "$f")"
            if [[ "$base" == *"-arm64-mac.zip" ]]; then
              cp "$f" "$OUT_DIR/m3u8-helper_${VERSION}_macos_arm64.zip"
            else
              cp "$f" "$OUT_DIR/m3u8-helper_${VERSION}_macos_x64.zip"
            fi
          done

          (
            cd "$OUT_DIR"
            sha256sum * > SHA256SUMS.txt
          )

          ls -la "$OUT_DIR"

      - name: Generate release description table
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          cat > release-body.md <<EOF
          ## 下载文件说明 / Asset Guide

          | 文件名模式 | 平台 | 用途 |
          |---|---|---|
          | \`m3u8-helper_${VERSION}_windows_x64_setup.exe\` | Windows x64 | 安装版（推荐普通用户） |
          | \`m3u8-helper_${VERSION}_windows_x64_portable.exe\` | Windows x64 | 便携免安装版 |
          | \`m3u8-helper_${VERSION}_macos_x64.dmg\` | macOS Intel | DMG 安装包 |
          | \`m3u8-helper_${VERSION}_macos_arm64.dmg\` | macOS Apple Silicon | DMG 安装包 |
          | \`m3u8-helper_${VERSION}_macos_x64.zip\` | macOS Intel | ZIP 压缩包 |
          | \`m3u8-helper_${VERSION}_macos_arm64.zip\` | macOS Apple Silicon | ZIP 压缩包 |
          | \`SHA256SUMS.txt\` | All | 文件校验值（SHA-256） |

          ---
          EOF

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft == 'true' || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease == 'true' || false }}
          generate_release_notes: true
          body_path: release-body.md
          files: |
            release-final/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
